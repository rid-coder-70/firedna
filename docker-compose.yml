version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: firedna_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: firedna
      POSTGRES_USER: firedna
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firedna -d firedna"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firedna_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://firedna:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}@db:5432/firedna"
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      ENVIRONMENT: production
      DEBUG: "False"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: firedna_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
